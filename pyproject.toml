[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-session"
version = "0.1.0"
description = "Resumable, rate-limited, integrity-checked fetch primitives for long-running scrape and extraction jobs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scrape-session contributors" }]
keywords = ["scraping", "resume", "rate-limit", "integrity", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/devops-gm88/scrape-session"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrape_session = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# UP is deliberately not selected: the source keeps `typing.Optional` / `Union`
# annotations on purpose, and rewriting them would be churn with no behaviour change.
select = ["E", "F", "W", "I", "B"]
